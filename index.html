<title>UX Labs Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3f7;
    --bg2:#fbe6ef;
    --card:#ffffff;
    --card-border:#f3d3e4;
    --text:#3a1330;
    --text-dim:#8a5c78;
    --text-faint:#c093ae;
    --magenta:#e8298c;
    --purple:#9142e8;
    --pink:#ff8fc9;
    --lavender:#b48cf2;
    --peach:#ffab91;
    --shadow:220,100,150;
    background:var(--bg);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1d0f1b;
      --bg2:#2a1526;
      --card:#2b1626;
      --card-border:#4c2841;
      --text:#fbeaf3;
      --text-dim:#d3a8c4;
      --text-faint:#9c6c8c;
      --magenta:#ff5fac;
      --purple:#bb84ff;
      --pink:#ffa4dc;
      --lavender:#cfabff;
      --peach:#ffb899;
      --shadow:0,0,0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1d0f1b;
    --bg2:#2a1526;
    --card:#2b1626;
    --card-border:#4c2841;
    --text:#fbeaf3;
    --text-dim:#d3a8c4;
    --text-faint:#9c6c8c;
    --magenta:#ff5fac;
    --purple:#bb84ff;
    --pink:#ffa4dc;
    --lavender:#cfabff;
    --peach:#ffb899;
    --shadow:0,0,0;
  }

  *{box-sizing:border-box;}

  body{
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-inline:20px;
    padding-block:48px;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    position:relative;
    overflow-x:hidden;
    isolation:isolate;
  }

  .glow{
    position:fixed;
    inset:-10%;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(40vmax 40vmax at 12% 15%, color-mix(in srgb, var(--pink) 45%, transparent), transparent 70%),
      radial-gradient(38vmax 38vmax at 90% 10%, color-mix(in srgb, var(--peach) 35%, transparent), transparent 70%),
      radial-gradient(46vmax 46vmax at 85% 92%, color-mix(in srgb, var(--lavender) 40%, transparent), transparent 70%),
      radial-gradient(32vmax 32vmax at 8% 95%, color-mix(in srgb, var(--magenta) 26%, transparent), transparent 70%),
      var(--bg2);
    animation:drift 28s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ transform:translate3d(0,0,0) scale(1); }
    100%{ transform:translate3d(-2%,2%,0) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    .glow{ animation:none; }
  }

  .sparkle{
    position:absolute;
    border-radius:50%;
    background:linear-gradient(135deg, var(--magenta), var(--lavender));
    opacity:0.6;
    filter:blur(0.5px);
  }
  .sparkle.one{ width:10px; height:10px; top:14%; left:12%; }
  .sparkle.two{ width:6px; height:6px; top:22%; right:16%; background:linear-gradient(135deg, var(--peach), var(--pink)); }
  .sparkle.three{ width:8px; height:8px; bottom:16%; right:10%; }
  .sparkle.four{ width:5px; height:5px; bottom:24%; left:9%; background:linear-gradient(135deg, var(--lavender), var(--magenta)); }
  @media (max-width:520px){
    .sparkle{ display:none; }
  }

  .stage{
    width:100%;
    max-width:740px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:clamp(26px,5vw,40px);
  }

  .logo{
    width:min(62vw,280px);
    height:auto;
    display:block;
    filter:drop-shadow(0 12px 32px rgba(var(--shadow),0.18));
  }

  .eyebrow{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:clamp(11px,2.4vw,13px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--magenta);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    width:26px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--pink));
  }
  .eyebrow::after{ background:linear-gradient(90deg, var(--pink), transparent); }

  h1{
    margin:0;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-style:normal;
    font-weight:600;
    font-size:clamp(30px,6.6vw,52px);
    line-height:1.1;
    letter-spacing:-0.01em;
    text-wrap:balance;
    background:linear-gradient(100deg, var(--magenta), var(--purple) 45%, var(--lavender) 70%, var(--peach));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    margin:-14px 0 0;
    max-width:44ch;
    color:var(--text-dim);
    font-size:clamp(14.5px,2.6vw,16.5px);
    line-height:1.65;
  }

  .countdown{
    display:grid;
    grid-auto-flow:column;
    gap:clamp(10px,2.4vw,16px);
  }

  .unit{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:clamp(14px,3.2vw,22px) clamp(10px,3vw,20px);
    min-width:clamp(62px,16vw,92px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    box-shadow:0 10px 30px rgba(var(--shadow),0.10);
  }

  .unit .num{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:clamp(25px,6.8vw,42px);
    line-height:1;
    background:linear-gradient(160deg, var(--magenta), var(--purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .unit .label{
    font-family:'Poppins',sans-serif;
    font-size:clamp(9.5px,2vw,11px);
    font-weight:500;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .target{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:clamp(11px,2.2vw,12.5px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .target .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:linear-gradient(120deg, var(--magenta), var(--lavender));
    box-shadow:0 0 10px color-mix(in srgb, var(--magenta) 55%, transparent);
    flex-shrink:0;
  }

  [hidden]{ display:none !important; }
</style>

<script>
(function(){
  var TARGET = new Date("2026-09-20T00:00:00-04:00").getTime();
  var els = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s')
  };
  var countdown = document.getElementById('countdown');
  var eyebrow = document.getElementById('eyebrow');
  var headline = document.getElementById('headline');
  var subline = document.getElementById('subline');
  var targetWrap = document.querySelector('.target');

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    var now = Date.now();
    var diff = TARGET - now;

    if (diff <= 0){
      eyebrow.textContent = "We're live";
      headline.textContent = "UX Labs Pro is here.";
      subline.textContent = "Thanks for waiting — the new site has arrived.";
      countdown.hidden = true;
      targetWrap.hidden = true;
      clearInterval(timer);
      return;
    }

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);

    try{
      els.d.textContent = pad(days);
      els.h.textContent = pad(hours);
      els.m.textContent = pad(mins);
      els.s.textContent = pad(secs);
    }catch(e){}
  }

  tick();
  var timer = setInterval(tick, 1000);
})();
</script>
